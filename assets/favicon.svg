<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .bg { fill: #DD4F1D; }
      .monogram {
        font-family: 'Cairo', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        font-size: 35px;
        fill: #FFFFFF;
        text-anchor: middle;
        dominant-baseline: central;
        letter-spacing: -1px;
      }
    </style>
  </defs>
  <!-- Squircle com proporção e raio refinados (Pantone 1665 C) -->
  <rect class="bg" width="64" height="64" rx="14" ry="14"/>
  <!-- Monograma ON em Branco Puro -->
  <text x="32" y="32.5" class="monogram">ON</text>
</svg>
