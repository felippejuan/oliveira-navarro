<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .bg { fill: #181514; }
      .letter-o {
        font-family: 'Cairo', system-ui, -apple-system, sans-serif;
        font-weight: 900;
        font-size: 46px;
        fill: #FF5514;
        text-anchor: end;
        dominant-baseline: central;
      }
      .letter-n {
        font-family: 'Cairo', system-ui, -apple-system, sans-serif;
        font-weight: 900;
        font-size: 46px;
        fill: #FFFFFF;
        text-anchor: start;
        dominant-baseline: central;
      }
    </style>
  </defs>
  <!-- Fundo Escuro com cantos arredondados -->
  <rect class="bg" x="0.5" y="0.5" width="63" height="63" rx="15" ry="15"/>
  <!-- Letras ON com contraste elétrico e tamanho ampliado -->
  <text x="32" y="32" class="letter-o">O</text>
  <text x="31" y="32" class="letter-n">N</text>
</svg>